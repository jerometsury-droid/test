name: Inspect supplied public Wiki
on:
  push:
    branches: [public-wiki-source]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: public-wiki-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - name: Observe anonymous public catalogue, stop on human verification
        run: node tools/inspect-public-wiki.cjs
      - name: Save public source audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public-wiki
          git diff --cached --quiet || git commit -m 'Record anonymous public Wiki catalogue evidence'
          git push origin HEAD:public-wiki-source
