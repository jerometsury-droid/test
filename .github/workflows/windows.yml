name: Kyara Solo Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test game logic, albums and local server
        run: npm test
      - name: Package Windows x64
        run: npm run package:windows
      - name: Exercise the packaged Windows application
        run: node tests/windows-smoke.cjs
      - name: Upload complete Windows application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KyaraSolo-Windows-v0.6.0
          path: dist/KyaraSolo-win32-x64/
          if-no-files-found: error
          retention-days: 30
